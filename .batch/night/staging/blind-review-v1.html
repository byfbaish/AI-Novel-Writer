<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>开篇盲评 · 10 章</title>
<style>
  :root{--ink:#1b1b1f;--ink2:#6b6b76;--line:#e3e3ea;--acc:#2f6feb;--bg:#fafafc}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
  header{padding:14px 20px 6px}
  h1{margin:0;font-size:17px;font-weight:650}
  .sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
  table{width:100%;border-collapse:collapse;margin:8px 0 0}
  th,td{border-top:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
  th{font-size:12.5px;font-weight:600;color:var(--ink2);border-top:0}
  td.ch{font-variant-numeric:tabular-nums;color:var(--ink2);width:52px}
  .dots{display:flex;gap:4px;justify-content:center}
  .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:11px;color:transparent;line-height:21px;user-select:none}
  .dot:hover{border-color:var(--acc)}
  .dot.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .note{width:150px}
  .note summary{cursor:pointer;font-size:12px;color:var(--ink2);list-style:none}
  .note summary::-webkit-details-marker{display:none}
  .note input{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:13px/1.4 inherit;margin-top:4px}
  footer{display:flex;gap:10px;align-items:center;padding:10px 20px 18px;flex-wrap:wrap}
  button{font:14px/1 inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .hint{color:var(--ink2);font-size:12px}
  @media (max-width:900px){.note{width:90px}td.ch{width:40px}}
</style>
</head>
<body>
<header>
  <h1>开篇盲评 · 10 章</h1>
  <div class="sub">每格点 1–5 分（1 最差、5 最好）。四列独立，不合成总分。备注默认收起，可留空。</div>
</header>
<table id="t">
  <thead><tr>
    <th>章</th><th>钩子强度</th><th>对话自然度</th><th>信息密度</th><th>爽点兑现</th><th>备注</th>
  </tr></thead>
  <tbody></tbody>
</table>
<footer>
  <button class="primary" id="exp">导出 JSON</button>
  <button id="clr">清空</button>
  <span class="hint" id="stat">已评 0 / 10 章</span>
</footer>
<script>
const COLS=[["hook","钩子强度"],["dialogue","对话自然度"],["density","信息密度"],["payoff","爽点兑现"]];
const ROWS=10;
const data={};
const tbody=document.querySelector("#t tbody");
for(let i=1;i<=ROWS;i++){
  const ch=String(i).padStart(2,"0");
  data[ch]={};
  const tr=document.createElement("tr");
  const tdch=document.createElement("td");tdch.className="ch";tdch.textContent="第 "+ch+" 章";tr.appendChild(tdch);
  for(const [key] of COLS){
    const td=document.createElement("td");
    const box=document.createElement("div");box.className="dots";
    for(let v=1;v<=5;v++){
      const b=document.createElement("button");
      b.className="dot";b.type="button";b.textContent=v;b.title=v+" 分";
      b.addEventListener("click",()=>{
        data[ch][key]=(data[ch][key]===v)?0:v;
        [...box.children].forEach((c,idx)=>c.classList.toggle("on",data[ch][key]===idx+1));
        refresh();
      });
      box.appendChild(b);
    }
    td.appendChild(box);tr.appendChild(td);
  }
  const tdnote=document.createElement("td");
  tdnote.innerHTML='<details class="note"><summary>＋</summary><input type="text" placeholder="可留空"></details>';
  tdnote.querySelector("input").addEventListener("input",e=>{data[ch].note=e.target.value});
  tr.appendChild(tdnote);
  tbody.appendChild(tr);
}
function refresh(){
  const n=Object.values(data).filter(r=>COLS.every(([k])=>r[k])).length;
  document.getElementById("stat").textContent="已评 "+n+" / "+ROWS+" 章";
}
document.getElementById("exp").onclick=()=>{
  const out={generatedAt:new Date().toISOString(),scale:"1-5",columns:COLS.map(([k,n])=>({key:k,label:n})),chapters:data};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  const d=new Date();const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0");
  a.href=URL.createObjectURL(blob);a.download="blind-review-"+stamp+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
document.getElementById("clr").onclick=()=>{
  if(!confirm("清空全部评分？"))return;
  for(const ch in data){data[ch]={};}
  document.querySelectorAll(".dot.on").forEach(d=>d.classList.remove("on"));
  document.querySelectorAll(".note input").forEach(i=>i.value="");
  refresh();
};
refresh();
</script>
</body>
</html>
